<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>(function(){var t;try{t=localStorage.getItem('glow-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-glow-theme',t)})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="M. Kjems, developer and designer in Copenhagen. Browser games: Gunfight, Multiplayer, Mastermind and Frontlines." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>M.Kjems</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <script>window.goatcounter = { path: (p) => location.host + p };</script>
  <script data-goatcounter="https://stats.mkjems.dk/count" async src="//stats.mkjems.dk/count.js"></script>
</head>

<body class="glow-root">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
