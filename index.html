<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script>(function(){var t;try{t=localStorage.getItem('glow-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-glow-theme',t)})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M. Kjems – Free Browser Games: Solitaire, Frontlines, Gunfight and more</title>
  <meta name="description"
    content="Free games that run in your browser, made by M. Kjems, a developer and designer in Copenhagen: Solitaire, Frontlines, Gunfight, Multiplayer and Mastermind. No ads, no sign-up." />
  <link rel="canonical" href="https://mkjems.dk/" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Link previews (Facebook, Messenger, WhatsApp, Slack, LinkedIn, X, ...). -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="M. Kjems" />
  <meta property="og:title" content="M. Kjems – Games for the browser" />
  <meta property="og:description"
    content="Five free browser games: Solitaire, Frontlines, Gunfight, Multiplayer and Mastermind. No ads, no sign-up." />
  <meta property="og:url" content="https://mkjems.dk/" />
  <meta property="og:locale" content="en_GB" />
  <meta name="twitter:card" content="summary" />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "M. Kjems",
      "url": "https://mkjems.dk/",
      "author": { "@type": "Person", "name": "M. Kjems", "url": "https://mkjems.dk/" },
      "hasPart": [
        { "@type": "VideoGame", "name": "Solitaire", "url": "https://solitaire.mkjems.dk/" },
        { "@type": "VideoGame", "name": "Frontlines", "url": "https://frontlines.mkjems.dk/" },
        { "@type": "VideoGame", "name": "Gunfight", "url": "https://gunfight.mkjems.dk/" },
        { "@type": "VideoGame", "name": "Multiplayer", "url": "https://multiplayer.mkjems.dk/" },
        { "@type": "VideoGame", "name": "Mastermind", "url": "https://mastermind.mkjems.dk/" }
      ]
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <script>window.goatcounter = { path: (p) => location.host + p };</script>
  <script data-goatcounter="https://stats.mkjems.dk/count" async src="//stats.mkjems.dk/count.js"></script>
</head>

<body class="glow-root">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
